version: '3.8'

services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - marinesight_data:/app/data
    # Exposing the port is optional if Caddy routes directly to the internal network, 
    # but useful if you want to bypass Caddy or test locally.
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  marinesight_data:
  caddy_data:
  caddy_config:
